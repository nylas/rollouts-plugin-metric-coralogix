# Local smoke tests only: no credentials and no reachable Kubernetes API.
apiVersion: v1
kind: Config
clusters:
  - name: smoke
    cluster:
      server: https://127.0.0.1:1
contexts:
  - name: smoke
    context:
      cluster: smoke
      user: smoke
      namespace: default
current-context: smoke
users:
  - name: smoke
    user: {}
